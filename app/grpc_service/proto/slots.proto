syntax = "proto3";

package eattime.slots;

message FindSlotsRequest {
    int64 restaurant_id = 1;
    string desired_start = 2;  // формат ISO-8601
    string desired_end = 3;
    int32 guests_count = 4;
    int32 limit = 5;           // сколько вариантов вернуть
}

message Slot {
    int64 place_id = 1;
    int32 seats = 2;
    string location = 3;
    string start_time = 4;
    string end_time = 5;
    int32 shift_minutes = 6;   // на сколько сдвинуто время
}

message FindSlotsResponse {
    repeated Slot slots = 1;
}

service SlotFinder {
    rpc FindAlternativeSlots(FindSlotsRequest) returns (FindSlotsResponse);
}