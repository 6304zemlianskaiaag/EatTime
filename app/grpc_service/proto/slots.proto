syntax = "proto3";

package eattime.slots;
//шаблон запроса
message FindSlotsRequest {
    int64 restaurant_id = 1;
    string desired_start = 2;  // формат ISO-8601 год-месяц-деньТчасы:минуты:секунды
    string desired_end = 3;
    int32 guests_count = 4;
}
//шаблон ответа
message Slot {
    int64 place_id = 1;
    int32 seats = 2;
    string location = 3;
    string start_time = 4;
    string end_time = 5;
}

message FindSlotsResponse {
    repeated Slot slots = 1;
}

service SlotFinder {
    rpc FindAlternativeSlots(FindSlotsRequest) returns ( stream Slot);
}